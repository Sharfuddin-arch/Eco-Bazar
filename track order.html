<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Eco Bazaar – Track Your Order</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Inter',sans-serif;
background:#0a1a0a;
overflow-x:hidden;
width:100%;
}

header{
position:sticky;
top:0;
z-index:10000;
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 60px;
background:#0f2e1a;
color:white;
box-shadow:0 2px 20px rgba(0,0,0,0.15);
width:100%;
}

.logo{
display:flex;
align-items:center;
gap:12px;
cursor:pointer;
}

.logo img{
width:42px;
height:42px;
border-radius:0;
object-fit:contain;
}

.logo-text{
font-family:'Playfair Display',serif;
font-size:1.6rem;
font-weight:600;
letter-spacing:1px;
color:#f5e6c8;
}

.logo-text span{
color:#d4a373;
font-weight:400;
}

header nav{
display:flex;
gap:32px;
}

header nav a{
color:#e8e0c8;
text-decoration:none;
font-weight:500;
font-size:0.95rem;
letter-spacing:0.3px;
transition:0.2s;
}

header nav a:hover{
color:#d4a373;
}

.cart-icon{
position:relative;
cursor:pointer;
display:flex;
align-items:center;
gap:8px;
background:rgba(212,163,115,0.2);
padding:8px 16px;
border-radius:40px;
transition:0.3s;
margin-left:20px;
}

.cart-icon:hover{
background:rgba(212,163,115,0.4);
transform:scale(1.02);
}

.cart-icon span{
font-size:1.2rem;
}

.cart-count{
background:#d4a373;
color:#0e2413;
border-radius:50%;
width:24px;
height:24px;
display:inline-flex;
align-items:center;
justify-content:center;
font-size:0.75rem;
font-weight:700;
margin-left:5px;
}

.header-right{
display:flex;
align-items:center;
}

.hero-section{
position:relative;
height:30vh;
min-height:250px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
overflow:hidden;
}

.bg-video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
filter:brightness(0.55) contrast(1.1);
}

.global-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:linear-gradient(135deg, rgba(10,26,10,0.65), rgba(15,46,26,0.55));
z-index:-1;
}

.hero-overlay{
position:absolute;
width:100%;
height:100%;
background:linear-gradient(135deg, rgba(10,26,10,0.5), rgba(15,46,26,0.35));
z-index:1;
}

.hero-content{
position:relative;
z-index:2;
color:white;
max-width:800px;
padding:0 20px;
animation:fadeInDown 0.8s ease;
}

.hero-content h1{
font-family:'Playfair Display',serif;
font-size:3rem;
font-weight:700;
margin-bottom:15px;
background:linear-gradient(135deg,#fff,#d4a373);
-webkit-background-clip:text;
background-clip:text;
color:transparent;
}

.hero-content p{
font-size:1rem;
opacity:0.9;
}

.tracking-container{
position:relative;
padding:60px 80px;
z-index:1;
max-width:1400px;
margin:0 auto;
}

.order-card{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
border-radius:32px;
padding:40px;
border:1px solid rgba(212,163,115,0.35);
margin-bottom:40px;
animation:fadeInUp 0.6s ease;
}

.order-header{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;
margin-bottom:25px;
padding-bottom:20px;
border-bottom:1px solid rgba(212,163,115,0.25);
}

.order-id{
font-family:monospace;
font-size:1.1rem;
background:rgba(212,163,115,0.2);
padding:6px 16px;
border-radius:40px;
color:#d4a373;
}

.order-status-badge{
background:#2c5530;
padding:6px 18px;
border-radius:40px;
font-size:0.85rem;
font-weight:600;
color:#f0ecd8;
animation:pulse 2s infinite;
}

@keyframes pulse{
0%{box-shadow:0 0 0 0 rgba(212,163,115,0.4);}
70%{box-shadow:0 0 0 10px rgba(212,163,115,0);}
100%{box-shadow:0 0 0 0 rgba(212,163,115,0);}
}

/* Progress Timeline */
.timeline-section{
margin:40px 0;
animation:fadeInUp 0.7s ease 0.1s backwards;
}

.timeline-title{
color:#f5e6c8;
font-size:1.3rem;
margin-bottom:25px;
font-weight:600;
}

.timeline{
display:flex;
justify-content:space-between;
position:relative;
flex-wrap:wrap;
gap:20px;
}

.timeline::before{
content:'';
position:absolute;
top:30px;
left:0;
right:0;
height:3px;
background:rgba(255,255,255,0.15);
border-radius:3px;
z-index:1;
}

.timeline-step{
flex:1;
text-align:center;
position:relative;
z-index:2;
min-width:100px;
}

.step-icon{
width:60px;
height:60px;
background:rgba(255,255,255,0.1);
border:2px solid rgba(212,163,115,0.4);
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
margin:0 auto 12px;
font-size:1.6rem;
transition:all 0.4s ease;
}

.timeline-step.completed .step-icon{
background:#2c5530;
border-color:#d4a373;
box-shadow:0 0 15px rgba(212,163,115,0.5);
transform:scale(1.05);
}

.timeline-step.active .step-icon{
background:rgba(212,163,115,0.3);
border-color:#d4a373;
animation:glowPulse 1.5s infinite;
}

@keyframes glowPulse{
0%{box-shadow:0 0 0 0 rgba(212,163,115,0.4);}
50%{box-shadow:0 0 0 8px rgba(212,163,115,0.2);}
100%{box-shadow:0 0 0 0 rgba(212,163,115,0);}
}

.step-label{
color:#e0d8c0;
font-size:0.85rem;
font-weight:500;
margin-top:8px;
}

.step-date{
font-size:0.7rem;
color:#b8c4a8;
margin-top:4px;
}

/* Countdown Timer */
.countdown-section{
background:rgba(0,0,0,0.35);
border-radius:24px;
padding:25px 30px;
margin:30px 0;
text-align:center;
border:1px solid rgba(212,163,115,0.3);
animation:fadeInUp 0.7s ease 0.2s backwards;
}

.countdown-title{
color:#d4a373;
font-size:0.9rem;
letter-spacing:2px;
margin-bottom:10px;
}

.countdown-timer{
display:flex;
justify-content:center;
gap:30px;
flex-wrap:wrap;
}

.countdown-block{
text-align:center;
}

.countdown-number{
font-size:2.5rem;
font-weight:800;
color:#f5e6c8;
font-family:monospace;
background:rgba(0,0,0,0.4);
padding:10px 20px;
border-radius:16px;
min-width:80px;
}

.countdown-label{
font-size:0.75rem;
color:#b8c4a8;
margin-top:8px;
}

/* Map Section */
.map-section{
margin:30px 0;
border-radius:24px;
overflow:hidden;
border:1px solid rgba(212,163,115,0.3);
transition:0.3s;
animation:fadeInUp 0.7s ease 0.3s backwards;
}

.map-section:hover{
border-color:rgba(212,163,115,0.6);
transform:scale(1.01);
}

.map-container iframe{
width:100%;
height:320px;
border:0;
display:block;
}

/* Order Items */
.items-section{
margin:30px 0;
background:rgba(255,255,255,0.05);
border-radius:24px;
padding:25px;
animation:fadeInUp 0.7s ease 0.4s backwards;
}

.items-section h3{
color:#d4a373;
margin-bottom:20px;
font-size:1.3rem;
}

.order-item{
display:flex;
justify-content:space-between;
padding:12px 0;
border-bottom:1px solid rgba(212,163,115,0.15);
color:#e0d8c0;
}

.order-item:last-child{
border-bottom:none;
}

.order-total{
display:flex;
justify-content:space-between;
padding-top:15px;
margin-top:10px;
font-weight:700;
color:#d4a373;
font-size:1.1rem;
border-top:2px solid rgba(212,163,115,0.3);
}

/* Delivery Address */
.address-section{
background:rgba(255,255,255,0.05);
border-radius:24px;
padding:25px;
margin-top:20px;
animation:fadeInUp 0.7s ease 0.5s backwards;
}

.address-section h3{
color:#d4a373;
margin-bottom:15px;
font-size:1.3rem;
display:flex;
align-items:center;
gap:10px;
}

.address-text{
color:#e0d8c0;
line-height:1.6;
padding-left:30px;
}

/* No Order Message */
.no-order{
text-align:center;
padding:80px 40px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(12px);
border-radius:32px;
border:1px solid rgba(212,163,115,0.3);
animation:fadeInUp 0.6s ease;
}

.no-order h2{
color:#f5e6c8;
margin-bottom:15px;
}

.no-order p{
color:#b8c4a8;
margin-bottom:25px;
}

.shop-btn{
display:inline-block;
padding:14px 35px;
background:linear-gradient(135deg,#2c5530,#1e3a1e);
border-radius:40px;
color:white;
text-decoration:none;
font-weight:600;
transition:0.3s;
border:1px solid rgba(212,163,115,0.3);
}

.shop-btn:hover{
transform:translateY(-3px);
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

footer{
text-align:center;
padding:28px;
background:rgba(9,32,16,0.9);
color:#b8c4a8;
font-size:0.8rem;
border-top:1px solid #2c5530;
position:relative;
z-index:1;
}

@keyframes fadeInUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes fadeInDown{
from{
opacity:0;
transform:translateY(-30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

@media (max-width:900px){
.tracking-container{padding:40px 30px;}
.timeline{flex-direction:column;align-items:flex-start;}
.timeline::before{display:none;}
.timeline-step{display:flex;align-items:center;gap:20px;width:100%;}
.step-icon{margin:0;}
.timeline-step .step-label{text-align:left;}
.countdown-timer{gap:15px;}
.countdown-number{font-size:1.5rem;padding:6px 12px;min-width:60px;}
header{padding:15px 25px;}
.hero-content h1{font-size:2.2rem;}
}

@media (max-width:550px){
.tracking-container{padding:30px 20px;}
.order-card{padding:25px;}
.countdown-number{font-size:1.2rem;padding:5px 10px;min-width:50px;}
}
</style>
</head>

<body>

<video class="bg-video" autoplay muted loop playsinline>
<source src="videos/pb v2.mp4" type="video/mp4">
</video>
<div class="global-overlay"></div>

<header>
<div class="logo" onclick="location.href='index.html'">
<img src="pictures/logo.png" alt="Eco Bazaar Logo">
<div class="logo-text">ECO BAZAAR<span> | organic</span></div>
</div>
<nav>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="services.html">Services</a>
<a href="contact.html">Contact Us</a>
</nav>
<div class="header-right">
<div class="cart-icon" onclick="location.href='checkout.html'">
<span>🛒</span>
<span class="cart-count" id="cartCount">0</span>
</div>
</div>
</header>

<div class="hero-section">
<div class="hero-overlay"></div>
<div class="hero-content">
<h1>Track Your Order</h1>
<p>Real-time updates on your eco-friendly delivery</p>
</div>
</div>

<div class="tracking-container" id="trackingContainer">
<!-- Dynamic content will be inserted here -->
</div>

<footer>
<p>© 2026 Eco Bazaar — Trusted marketplace for organic & sustainable living in Pakistan</p>
</footer>

<script>
// Cart Functions
function updateCartCount() {
    let cart = JSON.parse(sessionStorage.getItem('ecobazaar_cart') || '[]');
    let totalItems = cart.reduce((total, item) => total + (item.quantity || 1), 0);
    const cartCountEl = document.getElementById('cartCount');
    if(cartCountEl) cartCountEl.innerText = totalItems;
}
updateCartCount();

// Get active order from localStorage
function getActiveOrder() {
    let order = localStorage.getItem('ecobazaar_active_order');
    return order ? JSON.parse(order) : null;
}

// Format date
function formatDate(dateString) {
    if(!dateString) return 'Pending';
    let date = new Date(dateString);
    return date.toLocaleDateString('en-PK', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
}

// Calculate progress based on status
function getProgressPercent(status, hoursRemaining, estimatedHours) {
    if(status === 'delivered') return 100;
    if(status === 'out_for_delivery') return 90;
    if(status === 'shipped') return 60;
    if(status === 'packed') return 30;
    if(status === 'confirmed') return 10;
    return Math.max(5, Math.min(95, ((estimatedHours - hoursRemaining) / estimatedHours) * 100));
}

// Render tracking page
function renderTrackingPage() {
    const container = document.getElementById('trackingContainer');
    const order = getActiveOrder();
    
    if(!order) {
        container.innerHTML = `
            <div class="no-order">
                <h2>📦 No Active Order</h2>
                <p>You don't have any active orders to track.</p>
                <a href="index.html" class="shop-btn">Start Shopping →</a>
            </div>
        `;
        return;
    }
    
    // Calculate remaining time
    const placedDate = new Date(order.placedAt);
    const now = new Date();
    const hoursPassed = (now - placedDate) / (1000 * 60 * 60);
    const estimatedHours = order.estimatedDeliveryDays * 24;
    let hoursRemaining = Math.max(0, estimatedHours - hoursPassed);
    let daysRemaining = Math.floor(hoursRemaining / 24);
    let hrsRemaining = Math.floor(hoursRemaining % 24);
    
    // Determine current status
    let currentStatus = order.status;
    if(hoursRemaining <= 0 && currentStatus !== 'delivered') {
        currentStatus = 'out_for_delivery';
    }
    
    // Progress percentage
    let progressPercent = getProgressPercent(currentStatus, hoursRemaining, estimatedHours);
    
    // Timeline steps
    const steps = [
        { key: 'confirmed', label: 'Order Confirmed', icon: '✓' },
        { key: 'packed', label: 'Packed', icon: '📦' },
        { key: 'shipped', label: 'Shipped', icon: '🚚' },
        { key: 'out_for_delivery', label: 'Out for Delivery', icon: '🚛' },
        { key: 'delivered', label: 'Delivered', icon: '🏠' }
    ];
    
    let timelineHtml = '';
    let currentStepIndex = 0;
    const statusOrder = ['confirmed', 'packed', 'shipped', 'out_for_delivery', 'delivered'];
    let currentIndex = statusOrder.indexOf(currentStatus);
    if(currentIndex === -1) currentIndex = 0;
    
    steps.forEach((step, idx) => {
        let isCompleted = idx <= currentIndex;
        let isActive = idx === currentIndex;
        let stepDate = order.statusHistory?.find(h => h.status.toLowerCase().includes(step.key))?.timestamp || null;
        
        timelineHtml += `
            <div class="timeline-step ${isCompleted ? 'completed' : ''} ${isActive ? 'active' : ''}">
                <div class="step-icon">${step.icon}</div>
                <div class="step-label">${step.label}</div>
                <div class="step-date">${stepDate ? formatDate(stepDate) : (isCompleted ? 'Completed' : 'Pending')}</div>
            </div>
        `;
    });
    
    // Build items HTML
    let itemsHtml = '';
    let subtotal = 0;
    order.items.forEach(item => {
        let itemTotal = item.price * item.quantity;
        subtotal += itemTotal;
        itemsHtml += `
            <div class="order-item">
                <span>${item.name} ${item.variant ? `(${item.variant})` : ''} x ${item.quantity}</span>
                <span>Rs. ${itemTotal.toLocaleString()}</span>
            </div>
        `;
    });
    
    // Countdown message
    let countdownMessage = '';
    if(currentStatus === 'delivered') {
        countdownMessage = '✅ Your order has been delivered! Thank you for shopping with Eco Bazaar.';
    } else if(hoursRemaining >= 24) {
        countdownMessage = `🚚 Estimated delivery in ${daysRemaining} day${daysRemaining > 1 ? 's' : ''} ${hrsRemaining > 0 ? `and ${hrsRemaining} hours` : ''}`;
    } else if(hoursRemaining > 0) {
        countdownMessage = `⏰ Your order will arrive in ${Math.ceil(hoursRemaining)} hours!`;
    } else {
        countdownMessage = `📦 Out for delivery! Your package is on its way.`;
    }
    
    container.innerHTML = `
        <div class="order-card">
            <div class="order-header">
                <span class="order-id">Order #${order.orderId}</span>
                <span class="order-status-badge">${currentStatus === 'delivered' ? 'DELIVERED' : (currentStatus === 'out_for_delivery' ? 'OUT FOR DELIVERY' : currentStatus.toUpperCase())}</span>
            </div>
            
            <div class="timeline-section">
                <div class="timeline-title">Delivery Progress</div>
                <div class="timeline">
                    ${timelineHtml}
                </div>
            </div>
            
            <div class="countdown-section">
                <div class="countdown-title">ESTIMATED DELIVERY</div>
                <div class="countdown-timer">
                    <div class="countdown-block">
                        <div class="countdown-number" id="daysCount">${daysRemaining}</div>
                        <div class="countdown-label">Days</div>
                    </div>
                    <div class="countdown-block">
                        <div class="countdown-number" id="hoursCount">${hrsRemaining}</div>
                        <div class="countdown-label">Hours</div>
                    </div>
                </div>
                <p style="margin-top:15px; color:#d4a373; font-size:0.9rem;">${countdownMessage}</p>
            </div>
            
            <div class="map-section">
                <div class="map-container">
                    <iframe src="https://maps.google.com/maps?q=IOBM+University+Korangi+Creek+Karachi&z=12&output=embed" allowfullscreen="" loading="lazy"></iframe>
                </div>
            </div>
            
            <div class="items-section">
                <h3>Order Summary</h3>
                ${itemsHtml}
                <div class="order-total">
                    <span>Subtotal</span>
                    <span>Rs. ${subtotal.toLocaleString()}</span>
                </div>
                <div class="order-total" style="border-top:1px solid rgba(212,163,115,0.2); margin-top:5px;">
                    <span>Delivery Fee</span>
                    <span>Rs. ${order.deliveryFee || 150}</span>
                </div>
                <div class="order-total" style="border-top:none;">
                    <span>Tax (5%)</span>
                    <span>Rs. ${order.tax || Math.round(subtotal * 0.05)}</span>
                </div>
                <div class="order-total" style="color:#d4a373; font-size:1.2rem;">
                    <span>Total</span>
                    <span>Rs. ${order.totalAmount.toLocaleString()}</span>
                </div>
            </div>
            
            <div class="address-section">
                <h3>📍 Delivery Address</h3>
                <div class="address-text">
                    ${order.customerName}<br>
                    ${order.address}, ${order.city}<br>
                    Phone: ${order.phone}<br>
                    Email: ${order.email}
                </div>
            </div>
        </div>
    `;
}

// Update countdown in real-time
function updateCountdown() {
    const order = getActiveOrder();
    if(!order || order.status === 'delivered') return;
    
    const placedDate = new Date(order.placedAt);
    const now = new Date();
    const hoursPassed = (now - placedDate) / (1000 * 60 * 60);
    const estimatedHours = order.estimatedDeliveryDays * 24;
    let hoursRemaining = Math.max(0, estimatedHours - hoursPassed);
    let daysRemaining = Math.floor(hoursRemaining / 24);
    let hrsRemaining = Math.floor(hoursRemaining % 24);
    
    const daysEl = document.getElementById('daysCount');
    const hoursEl = document.getElementById('hoursCount');
    if(daysEl) daysEl.innerText = daysRemaining;
    if(hoursEl) hoursEl.innerText = hrsRemaining;
    
    // Update countdown message
    let countdownMsg = '';
    if(hoursRemaining >= 24) {
        countdownMsg = `🚚 Estimated delivery in ${daysRemaining} day${daysRemaining > 1 ? 's' : ''} ${hrsRemaining > 0 ? `and ${hrsRemaining} hours` : ''}`;
    } else if(hoursRemaining > 0) {
        countdownMsg = `⏰ Your order will arrive in ${Math.ceil(hoursRemaining)} hours!`;
    } else {
        countdownMsg = `📦 Out for delivery! Your package is on its way.`;
    }
    
    const msgEl = document.querySelector('.countdown-section p');
    if(msgEl) msgEl.innerText = countdownMsg;
    
    // Update status badge if hours remaining <= 0 and not delivered
    if(hoursRemaining <= 0 && order.status !== 'delivered') {
        order.status = 'out_for_delivery';
        localStorage.setItem('ecobazaar_active_order', JSON.stringify(order));
        const badge = document.querySelector('.order-status-badge');
        if(badge) badge.innerText = 'OUT FOR DELIVERY';
        renderTrackingPage(); // Re-render to update timeline
    }
}

// Initialize and set interval
renderTrackingPage();
setInterval(updateCountdown, 60000); // Update every minute

const bgVideo = document.querySelector('.bg-video');
if(bgVideo) bgVideo.playbackRate = 0.8;
</script>

</body>
</html>
